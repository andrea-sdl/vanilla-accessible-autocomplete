<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accessible select browser tests</title>
    <style>
      body { font: 16px/1.4 system-ui, sans-serif; margin: 2rem; }
      #results { padding-inline-start: 1.25rem; }
      .pass { color: green; } .fail { color: firebrick; white-space: pre-wrap; }
    </style>
    <script type="module" src="accessible-select.js"></script>
  </head>
  <body>
    <h1>Accessible select browser tests</h1>
    <form id="form">
      <label for="country">Select your country (required)</label>
      <accessible-select id="control">
        <select id="country" name="country" required>
          <option value="" disabled>Choose a country</option>
          <option value="fr" selected>France</option>
          <option value="de">Germany</option>
          <option value="ci">Côte d’Ivoire</option>
          <option value="duplicate">Duplicate one</option>
          <option value="duplicate">Duplicate two</option>
          <option value="disabled" disabled>Unavailable country</option>
        </select>
      </accessible-select>
      <button id="outside" type="button">Outside</button>
      <button type="reset">Reset</button>
    </form>
    <div id="outside-content">Non-focusable content outside the control</div>
    <ol id="results"></ol>
    <script type="module">
      const tick = () => new Promise(resolve => setTimeout(resolve));
      const settle = () => new Promise(resolve => setTimeout(resolve, 350));
      const results = document.querySelector("#results");
      const assert = (condition, message) => {
        if (!condition) throw new Error(message);
      };
      const run = async (name, check) => {
        const item = document.createElement("li");
        try {
          await check();
          item.className = "pass";
          item.textContent = `PASS: ${name}`;
        } catch (error) {
          item.className = "fail";
          item.textContent = `FAIL: ${name}\n${error.message}`;
          window.testFailures = (window.testFailures || 0) + 1;
        }
        results.append(item);
      };
      window.addEventListener("DOMContentLoaded", async () => {
        await customElements.whenDefined("accessible-select");
        const control = document.querySelector("#control");
        const source = document.querySelector("#country");
        const form = document.querySelector("#form");
        const root = control.shadowRoot;
        const disclosure = root.querySelector("details");
        const button = root.querySelector("[part=button]");
        const value = root.querySelector("[part=value]");
        const panel = root.querySelector("[part=panel]");
        const search = root.querySelector("[part=search]");
        const list = root.querySelector("[part=listbox]");
        const error = root.querySelector("[part=error]");
        const name = root.querySelector("[part=name]");
        const status = root.querySelector("[part=status]");
        const clear = root.querySelector("[part=clear]");
        const hint = root.querySelector("[part=hint]");
        const empty = root.querySelector("[part=empty]");
        const sourceIndex = text => [...source.options].findIndex(option => option.text === text);
        const listIndex = text => [...list.options].findIndex(option => option.text === text);

        await run("upgrades an explicitly labeled select and preserves its initial selection", () => {
          assert(source.hidden, "source select is still visible");
          assert(disclosure && button.tagName === "SUMMARY" && button.getAttribute("role") === "button", "disclosure is not accessible native details/summary");
          assert(list.tagName === "SELECT" && !list.name, "result list is not an unnamed native select");
          assert(list.getAttribute("aria-label") === "Select your country (required)", "result list has no source label");
          assert(list.getAttribute("aria-required") === "true", "result list did not mirror required state");
          assert(!search.hasAttribute("aria-label"), "search is still named by aria-label");
          assert(search.labels[0]?.textContent === "Search options", "search has no visible label element");
          assert(search.placeholder === "Search options", "search has no default placeholder");
          control.setAttribute("search-label", "Search countries");
          control.setAttribute("search-placeholder", "Find countries");
          assert(search.labels[0].textContent === "Search countries" && search.placeholder === "Find countries", "attribute changes did not update the search label and placeholder");
          control.removeAttribute("search-label");
          control.removeAttribute("search-placeholder");
          assert(source.selectedIndex === sourceIndex("France"), "initial source selection changed");
          assert(value.textContent === "France", "initial visible value is wrong");
        });

        await run("names the summary with a hidden name span and the visible value", () => {
          assert(!button.hasAttribute("aria-label"), "summary is still named by aria-label");
          const ids = (button.getAttribute("aria-labelledby") || "").split(/\s+/);
          assert(ids.length === 2 && ids[0] === name.id && ids[1] === value.id, "summary is not labelled by the name and value spans");
          assert(name.textContent === "Select your country (required)", "hidden name span does not carry the source label");
        });

        await run("marks an empty disabled placeholder as a muted visible value", () => {
          source.selectedIndex = 0;
          control.refresh();
          assert(value.hasAttribute("data-placeholder"), "placeholder has no visual state");
          source.selectedIndex = sourceIndex("France");
          control.refresh();
          assert(!value.hasAttribute("data-placeholder"), "selected value kept placeholder state");
        });

        await run("visible label activation opens the enhanced control and focuses search", () => {
          document.querySelector("label[for=country]").click();
          assert(disclosure.open && !panel.hidden, "label did not open the disclosure");
          assert(root.activeElement === search, "label did not focus search");
          control.close();
        });

        await run("summary Enter and Space keys open and close the disclosure", () => {
          button.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(disclosure.open && root.activeElement === search, "Enter did not open and focus search");
          button.dispatchEvent(new KeyboardEvent("keydown", { key: " ", bubbles: true, cancelable: true }));
          assert(!disclosure.open && panel.hidden, "Space did not close the disclosure");
        });

        await run("pointer activity on non-focusable outside content closes the panel", () => {
          button.click();
          document.querySelector("#outside-content").dispatchEvent(new Event("pointerdown", { bubbles: true, composed: true }));
          assert(!disclosure.open && panel.hidden, "outside pointer activity did not close the panel");
        });

        await run("filters without changing the source value and ignores accents", () => {
          button.click();
          search.value = "cote";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          assert(list.options.length === 1 && list.options[0].text === "Côte d’Ivoire", "accent-insensitive search failed");
          assert(source.value === "fr", "search changed the form value");
        });

        await run("does not select an exact search result when search loses focus", async () => {
          search.value = "Germany";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          document.querySelector("#outside").focus();
          search.dispatchEvent(new FocusEvent("focusout", { bubbles: true, composed: true }));
          await tick();
          assert(source.value === "fr", "blur selected the exact result");
          assert(search.value === "" && list.options.length === source.options.length, "close did not rebuild the full list");
        });

        await run("commits the exact duplicate option and emits native source events", () => {
          button.click();
          let inputs = 0;
          let changes = 0;
          source.addEventListener("input", () => inputs++, { once: true });
          source.addEventListener("change", () => changes++, { once: true });
          list.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, composed: true }));
          list.selectedIndex = listIndex("Duplicate two");
          list.dispatchEvent(new Event("input", { bubbles: true }));
          assert(source.selectedIndex === sourceIndex("Duplicate two"), "selected the wrong duplicate value");
          assert(new FormData(form).get("country") === "duplicate", "source select did not submit its canonical value");
          assert(inputs === 1 && changes === 1, "source input/change events did not fire once");
        });

        await run("pointer clicks commit a selectable result and close the panel", () => {
          if (panel.hidden) button.click();
          list.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, composed: true }));
          list.selectedIndex = listIndex("Germany");
          list.dispatchEvent(new Event("input", { bubbles: true }));
          assert(source.selectedIndex === sourceIndex("Germany"), "pointer click did not commit its result");
          assert(panel.hidden, "pointer click did not close the panel");
        });

        await run("keeps disabled options visible but cannot commit them", () => {
          const before = source.selectedIndex;
          if (panel.hidden) button.click();
          list.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, composed: true }));
          list.selectedIndex = listIndex("Unavailable country");
          list.dispatchEvent(new Event("input", { bubbles: true }));
          assert(list.options[listIndex("Unavailable country")].disabled, "disabled option is not represented as disabled");
          assert(source.selectedIndex === before, "disabled option changed the source selection");
        });

        await run("refreshes after a silent programmatic source change", () => {
          source.selectedIndex = sourceIndex("Côte d’Ivoire");
          control.refresh();
          assert(value.textContent === "Côte d’Ivoire", "refresh did not copy the source selection");
        });

        await run("arrow, Home, and End keys browse the list without committing", async () => {
          control.open();
          const before = source.selectedIndex;
          for (const [key, text] of [["ArrowDown", "Germany"], ["Home", "France"], ["End", "Duplicate two"]]) {
            list.selectedIndex = listIndex(text);
            list.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true }));
            list.dispatchEvent(new Event("input", { bubbles: true }));
            await tick();
            assert(source.selectedIndex === before, `${key} committed the current option`);
          }
          list.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
          assert(panel.hidden, "Escape did not close the panel");
          assert(source.selectedIndex === before, "Escape after browsing changed the source value");
        });

        await run("Enter in the result list commits and returns focus to the summary", () => {
          control.open();
          list.selectedIndex = listIndex("Germany");
          list.focus();
          list.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(source.selectedIndex === sourceIndex("Germany"), "Enter did not commit the current option");
          assert(panel.hidden, "Enter did not close the panel");
          assert(root.activeElement === button, "Enter did not return focus to the summary");
        });

        await run("entering the list on a disabled placeholder highlights the first selectable result for Enter", () => {
          source.selectedIndex = sourceIndex("Choose a country");
          control.refresh();
          control.open();
          assert(list.options[list.selectedIndex]?.disabled, "the list did not start on the disabled placeholder");
          search.dispatchEvent(new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true, cancelable: true }));
          assert(root.activeElement === list, "ArrowDown did not move focus to the list");
          assert(list.selectedIndex === listIndex("France"), "the first selectable result was not highlighted");
          list.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(source.selectedIndex === sourceIndex("France"), "Enter did not commit the highlighted result");
          assert(panel.hidden, "Enter did not close the panel");
        });

        await run("Enter in search commits the only remaining result", () => {
          control.open();
          search.value = "cote";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          search.focus();
          search.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(source.selectedIndex === sourceIndex("C\u00f4te d\u2019Ivoire"), "Enter in search did not commit the single result");
          assert(panel.hidden, "Enter in search did not close the panel");
        });

        await run("typing highlights the best match and Enter picks it from search or the list", () => {
          const label = document.createElement("label");
          label.htmlFor = "codes-test";
          label.textContent = "Codes";
          const control = document.createElement("accessible-select");
          const source = document.createElement("select");
          source.id = "codes-test";
          source.add(new Option("Disabled 7001", "x", false, false));
          source.options[0].disabled = true;
          source.add(new Option("7001", "7001"));
          source.add(new Option("70011", "70011", false, true));
          source.add(new Option("70012", "70012"));
          control.append(source);
          document.body.append(label, control);
          const search = control.shadowRoot.querySelector("[part=search]");
          const list = control.shadowRoot.querySelector("[part=listbox]");
          const key = (target, key) => target.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }));
          const highlighted = () => list.options[list.selectedIndex]?.text;
          const type = (text, value = "70011") => {
            source.value = value;
            control.open();
            search.value = text;
            search.dispatchEvent(new Event("input", { bubbles: true }));
          };
          type("7001");
          assert(highlighted() === "7001", `typing highlighted ${highlighted()} instead of the exact match`);
          key(search, "Enter");
          assert(source.value === "7001", "Enter in search kept the current option instead of the exact match");
          type("7001");
          key(search, "ArrowDown");
          key(list, "Enter");
          assert(source.value === "7001", "ArrowDown then Enter picked a different option than Enter in search");
          type("7001");
          key(search, "ArrowDown");
          list.selectedIndex = [...list.options].findIndex(item => item.text === "70012");
          key(list, "Enter");
          assert(source.value === "70012", "Enter did not pick the option the user moved to");
          type("700", "70012");
          key(search, "Enter");
          assert(source.value === "7001", "Enter kept the current option instead of the first match starting with the search");
          source.options[1].disabled = true;
          type("7001", "70012");
          key(search, "Enter");
          assert(source.value === "70011", "Enter picked a disabled exact match or skipped the first selectable start match");
          type("001", "70012");
          key(search, "Enter");
          assert(source.value === "70011", "Enter did not fall back to the first selectable result");
          type("", "70012");
          key(search, "Enter");
          assert(source.value === "70012", "an empty search changed the current option");
        });

        await run("Enter in search commits the first result when nothing matches better", () => {
          control.open();
          search.value = "duplicate";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          search.focus();
          search.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
          assert(source.selectedIndex === sourceIndex("Duplicate one"), "Enter did not commit the first result");
          assert(panel.hidden, "Enter did not close the panel");
        });

        await run("typing in the result list returns to search and filters without committing", () => {
          button.click();
          list.focus();
          const before = source.value;
          list.dispatchEvent(new KeyboardEvent("keydown", { key: "p", bubbles: true, cancelable: true }));
          assert(root.activeElement === search, "typing did not return focus to search");
          assert(search.value === "p", "typed character did not move to search");
          assert(list.options.length === 2, "search did not filter duplicate options");
          assert(source.value === before, "typing in the list committed a value");
          control.close();
        });

        await run("Backspace from the result list edits the search and returns focus", () => {
          control.open();
          search.value = "ger";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          list.focus();
          list.dispatchEvent(new KeyboardEvent("keydown", { key: "Backspace", bubbles: true, cancelable: true }));
          assert(search.value === "ge", "Backspace did not remove the last search character");
          assert(root.activeElement === search, "Backspace did not return focus to search");
          control.close();
        });

        await run("the clear button appears with a query and resets the search", () => {
          control.open();
          assert(clear.hidden, "clear button is visible with an empty search");
          search.value = "ger";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          assert(!clear.hidden, "clear button stayed hidden with a query");
          assert(clear.textContent.includes("Clear search"), "clear button has no accessible text");
          clear.click();
          assert(search.value === "", "clear button did not clear the search");
          assert(root.activeElement === search, "clear button did not focus search");
          assert(clear.hidden && list.options.length === source.options.length, "clear button did not rebuild the full list");
          control.close();
        });

        await run("an empty result set hides the list and shows the empty paragraph", () => {
          control.open();
          search.value = "zzz";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          assert(list.hidden, "empty result set kept the list visible");
          assert(!empty.hidden && empty.textContent === "No results", "empty result set showed no message");
          search.value = "";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          assert(!list.hidden && empty.hidden, "clearing the search did not restore the list");
          control.close();
        });

        await run("rapid typing announces one final result count", async () => {
          control.open();
          await settle();
          const before = status.textContent;
          search.value = "d";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          search.value = "germany";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          assert(status.textContent === before, "status announced an intermediate result count");
          await settle();
          assert(status.textContent === "1 result", "status did not settle on the final result count");
          control.close();
        });

        await run("a single result takes one row and stays a listbox", () => {
          control.open();
          search.value = "duplicate";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          const twoRows = list.getBoundingClientRect().height;
          search.value = "cote";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          const oneRow = list.getBoundingClientRect().height;
          assert(list.size >= 2, "single result turned the list into a dropdown");
          assert(oneRow > 0 && oneRow < twoRows * 0.75, `one result still took two rows (${oneRow} vs ${twoRows})`);
          search.value = "";
          search.dispatchEvent(new Event("input", { bubbles: true }));
          assert(list.getBoundingClientRect().height > twoRows, "the full list kept the single-row height");
          control.close();
        });

        await run("the open panel records a supported placement", () => {
          assert(typeof control.place === "function", "place() is missing");
          control.open();
          const placement = panel.dataset.placement;
          assert(placement === undefined || placement === "above", "panel recorded an unknown placement");
          control.close();
        });

        await run("a short panel scrolls only its list, never itself", () => {
          const style = document.createElement("style");
          style.textContent = "accessible-select.short-panel::part(panel) { max-block-size: 14rem; }";
          const label = document.createElement("label");
          label.htmlFor = "short-panel-test";
          label.textContent = "Short panel";
          const control = document.createElement("accessible-select");
          control.className = "short-panel";
          const source = document.createElement("select");
          source.id = "short-panel-test";
          for (let number = 1; number <= 100; number++) source.add(new Option(`Item ${number}`, number));
          control.append(source);
          document.body.append(style, label, control);
          control.open(false);
          const panel = control.shadowRoot.querySelector("[part=panel]");
          const list = control.shadowRoot.querySelector("[part=listbox]");
          const hint = control.shadowRoot.querySelector("[part=hint]");
          assert(panel.scrollHeight <= panel.clientHeight + 1, `the panel scrolls (${panel.scrollHeight} > ${panel.clientHeight})`);
          assert(list.scrollHeight > list.clientHeight, "the list does not scroll its extra options");
          assert(hint.getBoundingClientRect().bottom <= panel.getBoundingClientRect().bottom + 1, "the hint is cut off below the panel");
          control.close();
        });

        await run("limits a long unfiltered list but keeps its selected option visible", () => {
          const label = document.createElement("label");
          label.htmlFor = "many-items-test";
          label.textContent = "Many items";
          const control = document.createElement("accessible-select");
          const source = document.createElement("select");
          source.id = "many-items-test";
          for (let number = 1; number <= 100; number++) {
            const option = new Option(`Item ${String(number).padStart(3, "0")}`, number, false, number === 100);
            source.add(option);
          }
          control.append(source);
          document.body.append(label, control);
          const list = control.shadowRoot.querySelector("[part=listbox]");
          const items = [...list.options];
          const hint = control.shadowRoot.querySelector("[part=hint]");
          assert(items.length === 10, "long list showed more than 10 options");
          assert(!items.some(option => option.value === "-1"), "long list still uses a disabled hint option");
          assert(items.some(option => option.text === "Item 100"), "selected option was not visible");
          assert(list.options[list.selectedIndex].text === "Item 100", "selected option was not current in the list");
          assert(items.every(option => option.title === option.text), "options carry no tooltip text");
          assert(!hint.hidden && hint.textContent === "Showing 10 of 100. Search to see them all", "long list did not give a search hint paragraph");
        });

        await run("opens on native required validation and announces the browser message", () => {
          source.selectedIndex = 0;
          control.refresh();
          assert(!form.checkValidity(), "required select unexpectedly validated");
          assert(!panel.hidden && !error.hidden, "invalid select did not open the panel and error");
          assert(error.textContent === source.validationMessage && error.textContent, "error is not the browser validation message");
          assert(list.getAttribute("aria-invalid") === "true" && button.getAttribute("aria-invalid") === "true", "invalid state was not exposed on the summary and the result list");
          assert(!search.hasAttribute("aria-invalid"), "search filter was marked invalid");
          assert([button, search, list].every(item => item.getAttribute("aria-describedby") === error.id), "error was not linked to the visible controls");
          assert(root.activeElement === search, "invalid select did not focus search");
        });

        await run("resets the source select and visible value", async () => {
          form.reset();
          await tick();
          assert(source.selectedIndex === sourceIndex("France"), "native reset did not restore initial selection");
          assert(value.textContent === "France", "visible value did not reset");
          assert([button, list].every(item => !item.hasAttribute("aria-invalid")) && [button, search, list].every(item => !item.hasAttribute("aria-describedby")), "valid reset kept invalid state");
        });

        await run("leaves unsupported markup as native fallback", () => {
          const noLabel = document.createElement("accessible-select");
          noLabel.innerHTML = "<select><option>Native only</option></select>";
          const multiLabel = document.createElement("label");
          multiLabel.htmlFor = "multiple";
          multiLabel.textContent = "Multiple choices";
          const multiple = document.createElement("accessible-select");
          multiple.innerHTML = "<select id=multiple multiple><option>Native only</option></select>";
          const groupLabel = document.createElement("label");
          groupLabel.htmlFor = "grouped";
          groupLabel.textContent = "Grouped choices";
          const grouped = document.createElement("accessible-select");
          grouped.innerHTML = "<select id=grouped><optgroup label=One><option>Native only</option></optgroup></select>";
          document.body.append(noLabel, multiLabel, multiple, groupLabel, grouped);
          assert(!noLabel.shadowRoot && !noLabel.querySelector("select").hidden, "unlabeled select was enhanced");
          assert(!multiple.shadowRoot && !multiple.querySelector("select").hidden, "multiple select was enhanced");
          assert(!grouped.shadowRoot && !grouped.querySelector("select").hidden, "optgroup select was enhanced");
        });

        document.title = window.testFailures ? "Accessible select tests failed" : "Accessible select tests passed";
      });
    </script>
  </body>
</html>
